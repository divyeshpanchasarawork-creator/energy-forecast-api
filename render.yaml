services:
  - type: web
    name: energy-forecast-api
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app
      - key: BMRS_API_BASE_URL
        value: https://data.elexon.co.uk/bmrs/api/v1
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0
