spring.application.name=energy-forecast-api

server.port=${PORT:8080}

bmrs.api.base-url=${BMRS_API_BASE_URL:https://data.elexon.co.uk/bmrs/api/v1}

app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://127.0.0.1:5173,http://127.0.0.1:4173}

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
